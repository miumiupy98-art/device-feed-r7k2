name: Release beta full package

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: miuread-beta-release
  cancel-in-progress: false

jobs:
  release-beta:
    runs-on: ubuntu-latest
    env:
      SOURCE_BRANCH: main
      MANIFEST_NAME: update-beta.json
      RELEASE_CHANNEL: beta

    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Read and validate beta identity
        shell: bash
        run: |
          set -euo pipefail

          test -d miuread.koplugin
          test -f miuread.koplugin/main.lua
          test -f miuread.koplugin/_meta.lua
          test -f miuread.koplugin/miuread/config.lua
          test -s LICENSE
          test -s NOTICE
          test -s THIRD_PARTY_NOTICES
          test -s miuread.koplugin/LICENSE
          test -s miuread.koplugin/NOTICE
          test -s miuread.koplugin/THIRD_PARTY_NOTICES
          grep -Fq 'GNU AFFERO GENERAL PUBLIC LICENSE' LICENSE
          grep -Fq '许可证：AGPL-3.0-only。' miuread.koplugin/main.lua

          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          config_path = Path("miuread.koplugin/miuread/config.lua")
          meta_path = Path("miuread.koplugin/_meta.lua")
          config = config_path.read_text(encoding="utf-8")
          meta = meta_path.read_text(encoding="utf-8")

          version_pattern = r"[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+"
          config_version = re.search(
              r'\bVERSION\s*=\s*["\'](' + version_pattern + r')["\']',
              config,
          )
          meta_version = re.search(
              r'\bversion\s*=\s*["\'](' + version_pattern + r')["\']',
              meta,
          )
          channel = re.search(r'\bUPDATE_CHANNEL\s*=\s*["\']([^"\']+)["\']', config)
          label = re.search(r'\bUPDATE_CHANNEL_LABEL\s*=\s*["\']([^"\']+)["\']', config)

          if not config_version or not meta_version:
              print("::error::内测版本号必须类似 3.1.0-beta.2。")
              sys.exit(1)
          if config_version.group(1) != meta_version.group(1):
              print("::error::config.lua 与 _meta.lua 的版本号不一致。")
              sys.exit(1)
          if not channel or channel.group(1) != "beta":
              print("::error::插件不是内测通道。")
              sys.exit(1)
          if not label or label.group(1) != "内测通道":
              print("::error::内测通道名称配置错误。")
              sys.exit(1)
          manifest = re.search(r'\bUPDATE_MANIFEST\s*=\s*["\']([^"\']+)["\']', config)
          expected_manifest = (
              "https://raw.githubusercontent.com/miumiupy98-art/"
              "device-feed-r7k2/main/update-beta.json"
          )
          if not manifest or manifest.group(1) != expected_manifest:
              print("::error::内测更新清单地址配置错误。")
              sys.exit(1)

          version = config_version.group(1)
          changelog = Path(f"CHANGELOG-{version}.txt")
          if not changelog.is_file() or not changelog.read_text(encoding="utf-8").strip():
              print(f"::error::缺少当前版本更新说明：{changelog}")
              sys.exit(1)

          notes = changelog.read_text(encoding="utf-8").strip()
          lines = [line.strip() for line in notes.splitlines() if line.strip()]
          if len(lines) > 4 or len(notes) > 180:
              print("::error::更新说明必须保持简短，最多 4 行且不超过 180 个字符。")
              sys.exit(1)
          for char in notes:
              code = ord(char)
              if char == "\n" or 0x20 <= code <= 0x7E or 0x4E00 <= code <= 0x9FFF:
                  continue
              print(f"::error::更新说明包含不适合设备弹窗显示的字符：U+{code:04X}")
              sys.exit(1)

          Path("release.env").write_text(
              f"VERSION={version}\n"
              f"RELEASE_TAG=v{version}\n"
              f"PACKAGE_NAME=miuread-v{version}-full.zip\n",
              encoding="utf-8",
          )
          PY

          cat release.env >> "$GITHUB_ENV"

          if find miuread.koplugin -type f \( \
              -iname '*.md' -o \
              -iname '*.epub' -o \
              -iname '*.log' -o \
              -name '.DS_Store' -o \
              -name 'miuread.lua' -o \
              -name 'settings.reader.lua' \
          \) | grep -q .; then
            echo "::error::插件目录包含不应发布的文件。"
            exit 1
          fi

      - name: Run Lua syntax checks
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y lua5.1
          find miuread.koplugin -type f -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p

      - name: Build beta full package and manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile, ZipInfo
          import hashlib
          import json
          import os

          version = os.environ["VERSION"]
          package_name = os.environ["PACKAGE_NAME"]
          repo = os.environ["GITHUB_REPOSITORY"]
          root = Path("miuread.koplugin")
          output = Path("dist") / package_name
          fixed_time = (2020, 1, 1, 0, 0, 0)

          excluded_names = {".DS_Store", "miuread.lua", "settings.reader.lua", "NON_COMMERCIAL_NOTICE.txt"}
          excluded_suffixes = {".md", ".epub", ".log"}

          def excluded(path):
              return (
                  "__MACOSX" in path.parts
                  or path.name in excluded_names
                  or path.suffix.lower() in excluded_suffixes
              )

          with ZipFile(output, "w", compression=ZIP_DEFLATED, compresslevel=9) as archive:
              directories = [root] + sorted(
                  [path for path in root.rglob("*") if path.is_dir()],
                  key=lambda path: path.as_posix(),
              )
              for path in directories:
                  info = ZipInfo(path.as_posix().rstrip("/") + "/", fixed_time)
                  info.create_system = 3
                  info.external_attr = (0o40755 << 16) | 0x10
                  archive.writestr(info, b"")

              files = sorted(
                  [
                      path
                      for path in root.rglob("*")
                      if path.is_file() and not excluded(path)
                  ],
                  key=lambda path: path.as_posix(),
              )
              for path in files:
                  info = ZipInfo(path.as_posix(), fixed_time)
                  info.create_system = 3
                  info.external_attr = 0o100644 << 16
                  info.compress_type = ZIP_DEFLATED
                  archive.writestr(info, path.read_bytes())

          payload = output.read_bytes()
          official = (
              f"https://github.com/{repo}/releases/download/"
              f"v{version}/{package_name}"
          )
          notes = Path(f"CHANGELOG-{version}.txt").read_text(encoding="utf-8").strip()
          manifest = {
              "version": version,
              "name": f"觅阅 · 微信读书助手 {version} 内测版",
              "channel": "beta",
              "package_type": "full",
              "package_url": official,
              "package_urls": [
                  official,
                  f"https://ghfast.top/{official}",
                  f"https://gh-proxy.com/{official}",
                  f"https://ghproxy.net/{official}",
              ],
              "size": len(payload),
              "sha256": hashlib.sha256(payload).hexdigest(),
              "summary": notes,
              "notes": notes,
          }
          Path("dist/update-beta.json").write_text(
              json.dumps(manifest, ensure_ascii=True, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Verify beta package and manifest
        shell: bash
        run: |
          set -euo pipefail
          unzip -t "dist/$PACKAGE_NAME"

          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib
          import json
          import os
          import sys

          package = Path("dist") / os.environ["PACKAGE_NAME"]
          manifest = json.loads(Path("dist/update-beta.json").read_text(encoding="utf-8"))
          notes = Path(f"CHANGELOG-{os.environ['VERSION']}.txt").read_text(encoding="utf-8").strip()
          required = {
              "miuread.koplugin/_meta.lua",
              "miuread.koplugin/main.lua",
              "miuread.koplugin/miuread/config.lua",
              "miuread.koplugin/LICENSE",
              "miuread.koplugin/NOTICE",
              "miuread.koplugin/THIRD_PARTY_NOTICES",
          }
          forbidden_names = {".DS_Store", "miuread.lua", "settings.reader.lua"}
          forbidden_suffixes = {".md", ".epub", ".log"}

          with ZipFile(package) as archive:
              names = archive.namelist()
              damaged = archive.testzip()

          errors = []
          if damaged:
              errors.append(f"ZIP 损坏：{damaged}")
          for name in sorted(required.difference(names)):
              errors.append(f"安装包缺少：{name}")
          for name in names:
              path = Path(name)
              if not name.startswith("miuread.koplugin/"):
                  errors.append(f"安装包根目录错误：{name}")
              if (
                  path.name in forbidden_names
                  or path.suffix.lower() in forbidden_suffixes
                  or "__MACOSX" in path.parts
              ):
                  errors.append(f"不应进入安装包：{name}")
          if manifest.get("version") != os.environ["VERSION"]:
              errors.append("更新清单版本错误")
          if manifest.get("channel") != "beta":
              errors.append("更新清单通道错误")
          if manifest.get("notes") != notes or manifest.get("summary") != notes:
              errors.append("线上更新摘要未使用当前 CHANGELOG")
          if manifest.get("size") != package.stat().st_size:
              errors.append("更新清单文件大小错误")
          if manifest.get("sha256") != hashlib.sha256(package.read_bytes()).hexdigest():
              errors.append("更新清单 SHA-256 错误")

          if errors:
              for error in errors:
                  print(f"::error::{error}")
              sys.exit(1)
          print(f"内测版安装包检查通过，共 {len(names)} 个条目。")
          PY

      - name: Create or update beta prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          FILE="dist/$PACKAGE_NAME"
          NOTES_FILE="CHANGELOG-$VERSION.txt"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            while IFS= read -r asset; do
              [ -n "$asset" ] || continue
              gh release delete-asset "$RELEASE_TAG" "$asset" --yes
            done < <(
              gh release view "$RELEASE_TAG" \
                --json assets \
                --jq '.assets[].name'
            )
            gh release upload "$RELEASE_TAG" "$FILE"
            gh release edit "$RELEASE_TAG" \
              --target main \
              --title "觅阅 · 微信读书助手 $VERSION 内测版" \
              --notes-file "$NOTES_FILE" \
              --prerelease \
              --latest=false
          else
            gh release create "$RELEASE_TAG" "$FILE" \
              --target main \
              --title "觅阅 · 微信读书助手 $VERSION 内测版" \
              --notes-file "$NOTES_FILE" \
              --prerelease \
              --latest=false
          fi

          mapfile -t ASSETS < <(
            gh release view "$RELEASE_TAG" \
              --json assets \
              --jq '.assets[].name'
          )
          if [ "${#ASSETS[@]}" -ne 1 ] || [ "${ASSETS[0]}" != "$PACKAGE_NAME" ]; then
            printf '%s\n' "${ASSETS[@]}"
            echo "::error::Release 中应只保留 $PACKAGE_NAME。"
            exit 1
          fi

      - name: Verify public download URL
        shell: bash
        run: |
          set -euo pipefail

          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$PACKAGE_NAME"
          EXPECTED="$(python3 -c 'import json; print(json.load(open("dist/update-beta.json"))["sha256"])')"
          success=0
          for attempt in $(seq 1 12); do
            rm -f dist/public-download.zip
            if curl --fail --location --silent --show-error \
                --connect-timeout 20 --max-time 180 \
                --output dist/public-download.zip "$URL"; then
              ACTUAL="$(sha256sum dist/public-download.zip | awk '{print $1}')"
              if [ "$ACTUAL" = "$EXPECTED" ]; then
                success=1
                break
              fi
            fi
            sleep 5
          done
          if [ "$success" != "1" ]; then
            echo "::error::Release 下载地址尚不可用或校验失败；不会更新内测版清单。"
            exit 1
          fi

      - name: Publish beta manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          CONTENT="$(base64 -w 0 dist/update-beta.json)"
          API_PATH="repos/$GITHUB_REPOSITORY/contents/update-beta.json"
          CURRENT_SHA="$(gh api "$API_PATH?ref=main" --jq '.sha' 2>/dev/null || true)"

          if [ -n "$CURRENT_SHA" ]; then
            gh api --method PUT "$API_PATH" \
              -f message="Update update-beta.json to $RELEASE_TAG" \
              -f content="$CONTENT" \
              -f branch="main" \
              -f sha="$CURRENT_SHA" >/dev/null
          else
            gh api --method PUT "$API_PATH" \
              -f message="Add update-beta.json for $RELEASE_TAG" \
              -f content="$CONTENT" \
              -f branch="main" >/dev/null
          fi
